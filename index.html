.fx{max-width:900px;margin:22px auto 0;font-size:14px;color:#0f172a}

.fx-opts{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;background:#fcfdff;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;margin-top:12px}
@media(max-width:700px){.fx-form,.fx-opts{grid-template-columns:1fr}}
.fx-f label{display:block;font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:5px}
.fx-f input,.fx-f select{width:100%;padding:11px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;background:#fcfdff;outline:none}
.fx-f input:focus,.fx-f select:focus{border-color:#f43f5e}
.fx-mo input{border-color:#f43f5e;background:#fff1f2;font-weight:700}
.fx-tw{padding:0 18px;overflow-x:auto}
.fx-t{width:100%;border-collapse:collapse;border:1px solid #e2e8f0;min-width:480px}
.fx-t th{background:#f8fafc;font-size:10px;text-transform:uppercase;color:#64748b;padding:10px;text-align:left}
.fx-t td{padding:6px;border-top:1px solid #f1f5f9}
.fx-t td input{width:100%;padding:9px;border:1px solid transparent;background:#f8fafc;border-radius:8px;font-size:13px;outline:none}
.fx-t td input:focus{border-color:#f43f5e;background:#fff}
.fx-x{border:none;background:#fee2e2;color:#dc2626;width:24px;height:24px;border-radius:6px;cursor:pointer}
.fx-total{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to right,#fff,#fff1f2);border-top:2px solid #ffe4e6;gap:10px}
.fx-total b{font-size:24px;font-weight:800;color:#f43f5e}
.fx-actions{padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid #f1f5f9}
.fx-btn{padding:12px 18px;border-radius:10px;border:1.5px solid transparent;font-weight:700;cursor:pointer;font-size:13px}
.fx-save{background:#0f172a;color:#fff}
.fx-see{background:#f43f5e;color:#fff}
.fx-ghost{background:#fff;border-color:#e2e8f0;color:#64748b}
.fx-badge{background:#f43f5e;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:4px}

.fx-doc{background:#fff;border-radius:20px;border:1px solid #e2e8f0;box-shadow:0 20px 60px rgba(15,23,42,.12);overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fx-head{background:#0f172a;color:#fff;padding:30px 28px 24px;text-align:center}
.fx-head h2{margin:0;font-size:30px;font-weight:800;letter-spacing:1px}
.fx-sub{font-size:11px;opacity:.85;margin-top:8px;letter-spacing:.18em}

.fx-body{padding:26px 28px 24px}
.fx-meta{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:16px}
.fx-client{background:linear-gradient(to right,#f8fafc,#fff1f2);border:1px solid #e2e8f0;border-left:5px solid #f43f5e;padding:14px 16px;border-radius:12px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.fx-el{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}

.fx-sealrow{display:flex;justify-content:flex-end;margin:6px 10px 0}.fx-pay{display:inline-flex;align-items:flex-start;gap:14px;border:4px solid #16a34a;color:#16a34a;background:rgba(255,255,255,.96);padding:14px 28px 12px 18px;transform:rotate(-8deg);border-radius:16px;box-shadow:0 10px 26px rgba(22,163,74,.25),0 0 0 7px rgba(22,163,74,.08);position:relative;min-width:270px;margin:6px 6px 4px 0}

.fx-pay .p{font-size:34px;font-weight:900;letter-spacing:4.5px;line-height:1}

.fx-mlist{padding:16px;background:#f8fafc}
.fx-mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap}
.fx-mtype{background:#0f172a;color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px}
.fx-mb{border:none;background:#f1f5f9;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}
.fx-mb.see{background:#fff1f2;color:#f43f5e}
.fx-mb.del{background:#fee2e2;color:#dc2626}
.fx-form4{padding:6px 18px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

(function(){
  var KB=[
{"id":"present","k":["c est quoi","presentation","application","appli","a quoi sert","union imprimerie","union","site","utilite","explique","tout expliquer","fonctionnalite"],"a":"UNION IMPRIMERIE est une application de gestion pour imprimerie. Tu peux :\n• consulter le catalogue et les prix,\n• composer un devis et générer un proforma,\n• faire des factures et des reçus (prix modifiables ligne par ligne),\n• retrouver, modifier, imprimer ou exporter tous tes documents dans la Mémoire,\n• régler tes propres prix et tes propres produits (bouton « 🛍️ Mes produits »),\n• gérer ta liste de clients et ton profil d’entreprise,\n• discuter avec les autres membres dans le tchat de groupe.\nPose-moi une question ou choisis un sujet ci-dessous."},
{"id":"menu","k":["menu","navigation","rubrique","section","onglet","partie","ou trouver","comment naviguer"],"a":"Le menu contient :\n• Tableau de bord : la vue d’ensemble\n• Clients : ta liste de clients\n• Catalogue & tarifs : tous les produits et prix\n• Proforma : la commande en cours\n• Proforma : le devis validé, en attente de paiement\n• Factures & Reçus : la facture finale et les reçus\n• Impayés : les factures où il reste de l’argent à recevoir ; le bouton « Encaisser » enregistre un paiement et crée le reçu tout seul\n• Historique : tous tes documents, avec recherche\n• Fournisseurs : ceux qui te vendent le matériel\n• Achats : tes achats de matériel (comptés dans les dépenses)\n• Gestion & Dépenses : chiffre d’affaires, dépenses, bénéfice\n• Mon profil / Mon entreprise : tes informations\nUn bouton Admin est aussi disponible pour l’administrateur."},
{"id":"dashboard","k":["tableau de bord","accueil","dashboard","vue d ensemble","bonjour"],"a":"Le Tableau de bord est la page d’accueil. Tu y vois ton nom et ton entreprise, l’état de ton accès (actif ou bloqué), le nombre de produits dans ton devis, le catalogue et ton dernier proforma avec son statut."},
{"id":"modprix","k":["modifier les prix","changer les prix","modifier le prix","changer le prix","modifier prix","changer prix","mes prix","mes tarifs","mon prix","mon tarif","mon propre prix","prix unitaire","p u","mettre mes prix","tarif perso","personnaliser","autre prix","prix different","augmenter","baisser","remise","reduction","rabais","negocier","corriger le prix","corriger prix"],"a":"Il y a 2 façons de changer un prix :\n\nA) Dans ton catalogue (le prix change partout : devis, proforma, factures) :\n1. Clique sur le crayon ✏️ d’une carte produit (Tableau de bord ou Catalogue & tarifs), ou sur le bouton « 🛍️ Mes produits » (en bas de l’écran) puis touche le produit.\n2. Change le « Prix (FCFA) » (et le nom si tu veux), puis « Enregistrer ».\nDemande-moi « Mes produits » pour tous les détails.\n\nB) Pour un seul document (sans toucher au catalogue) :\n1. Ouvre « Factures & Reçus ». Si tu pars d’un devis, valide-le en proforma puis clique sur « Convertir en Facture » (page Proforma).\n2. Dans le tableau, clique dans la case « P.U » de la ligne, efface l’ancien prix et tape le tien. Le Total se recalcule tout seul. Tu peux aussi changer « Qté » et « Désignation ».\n3. « + Ligne » ajoute un article, « ✕ » supprime une ligne. Pour une remise, utilise la colonne « Remise % » (par ligne) ou « Remise globale (FCFA) ». Le champ « Main d’œuvre (FCFA) » ajoute ton travail au total.\n4. « 💾 Sauvegarder dans Mémoire » pour garder le document.\n\nDocument déjà enregistré : Factures & Reçus → « 📚 Mémoire » → « ✏️ Ouvrir », change le P.U, puis « 💾 Sauvegarder dans Mémoire » (il est mis à jour, pas dupliqué)."},
{"id":"mesproduits","k":["mes produits","mes produit","ajouter un produit","nouveau produit","creer un produit","cacher un produit","masquer un produit","cacher","masquer","supprimer un produit","mon catalogue","crayon","prix d origine","remettre les prix","affichage","mode liste","compact","produit perso","changer le nom du produit","renommer"],"a":"Le bouton « 🛍️ Mes produits » (noir, en bas de l’écran) te permet de régler TON catalogue. Tes prix et tes produits sont à toi : ils ne sont pas partagés avec les autres comptes.\n• Modifier un produit : touche-le (ou clique sur le crayon ✏️ de sa carte dans le catalogue), change le nom, le prix, l’unité (/ page, / pièce, / m²…), l’image, puis « Enregistrer ».\n• « + Ajouter un produit » : crée un nouveau produit avec son prix.\n• Bouton vert : montre ou cache un produit dans le catalogue (sans le supprimer).\n• ⭐ « Mettre en premier » : le produit passe en tête du catalogue.\n• « Supprimer » : possible seulement pour les produits que tu as ajoutés toi-même.\n• Affichage : Cartes, Liste ou Compact.\n• « ↺ Remettre les prix d’origine » : revient aux prix et noms de départ.\nLes devis, proformas et factures utilisent ensuite tes prix."},
{"id":"catalogue","k":["catalogue","tarif","prix","produit","combien","cout","coute","bache","autocollant","vinyle","bristol","tee shirt","tshirt","maillot","sublimation","dtf","polo","lacoste","papier","carte","poster","tableau encadre","rechercher un produit"],"a":"Le Catalogue & tarifs liste tous tes produits (papier, autocollants, bâches, vinyles, tee-shirts, maillots, tableaux encadrés…) avec leur prix HT en FCFA.\nUtilise « Rechercher un produit… » pour trouver vite, puis clique sur « Ajouter » pour l’envoyer dans le proforma.\nPour changer un prix, clique sur le crayon ✏️ de la carte ou utilise « 🛍️ Mes produits » (demande-moi « Mes produits »). Pour un prix valable sur un seul document, change la colonne P.U dans « Factures & Reçus »."},
{"id":"devis","k":["devis","commande","panier","quantite","retirer","vider","valider","ajouter produit","total du devis","montant"],"a":"Pour faire un devis :\n1. Va dans Catalogue & tarifs et clique sur « Ajouter » sur chaque produit voulu.\n2. Ouvre « Proforma » : tu vois la désignation, les quantités et le Montant total HT.\n3. Tu peux « Retirer » un produit ou « Vider le proforma ».\n4. « 🖨️ Imprimer / PDF » imprime le proforma, « Convertir en Facture » le transforme en facture modifiable, et « Valider le proforma » l’enregistre (statut « En attente »)."},
{"id":"proforma","k":["proforma","pro forma","pf 2026","en attente","voir le recu proforma","recu proforma"],"a":"Quand tu valides le proforma, il prend un N° (ex. PF-2026-001), le statut « En attente », et il est enregistré dans l’Historique avec le nom du client. Sur la même page « Proforma » tu peux :\n• « Imprimer / PDF »,\n• « Convertir en Facture » pour obtenir une facture dont tu peux modifier les prix."},
{"id":"facture_creer","k":["facture","faire une facture","creer une facture","creer facture","nouvelle facture","faire facture","comment facturer","facturer","etablir une facture","generer une facture","faire un recu","creer un recu","nouveau recu","ecrire une facture","remplir une facture"],"a":"Pour faire une facture (ou un reçu) :\n1. Menu → « Factures & Reçus ».\n2. En haut, choisis l’onglet FACTURE ou REÇU.\n3. Vérifie le N° (il se met tout seul : UI-2026-001, 002…) et la date.\n4. Tape le nom du client : s’il est dans ta liste, son téléphone et son entreprise se remplissent. Sinon complète téléphone, entreprise et adresse (facultatifs).\n5. Dans le tableau, remplis Désignation, Qté, P.U et Remise % (réduction sur la ligne). Clique « + Ligne » pour chaque article en plus.\n6. Ajoute si besoin la Garantie (ex. 6 mois), la Main d’œuvre, la Remise globale (FCFA), la TVA (%) et l’Acompte versé : le Net à payer et le Reste à payer se calculent tout seuls.\n7. Choisis le Mode de paiement : Wave, Payé Cash, Orange Money, Espèces, Virement ou Non Payé. Le cachet PAYÉ / NON PAYÉ se met à jour tout seul.\n8. « 👁️ Voir » montre l’aperçu, « 🖨️ Imprimer » imprime (ou enregistre en PDF depuis la fenêtre d’impression), « 💾 Sauvegarder dans Mémoire » la garde.\nPour en commencer une autre, clique « 📄 Nouveau »."},
{"id":"facture_devis","k":["depuis un devis","du devis","convertir","transformer","proforma en facture","devis en facture","passer en facture","vers facture","a partir du devis","convertir en facture","en facture"],"a":"Pour transformer un devis en facture :\n1. Catalogue & tarifs → « Ajouter » les produits voulus.\n2. Page « Proforma » → « Valider le proforma », puis « Convertir en Facture ».\n3. La page « Factures & Reçus » s’ouvre avec les articles, les quantités et les prix du catalogue déjà remplis, et un nouveau N°.\n4. Complète le client, change les prix dans la colonne P.U si besoin, choisis le mode de paiement.\n5. « 💾 Sauvegarder dans Mémoire », puis « 🖨️ Imprimer ».\nPour obtenir un reçu au lieu d’une facture, clique sur l’onglet REÇU. Le proforma de départ reste inchangé."},
{"id":"recu","k":["recu","difference","facture ou recu","recu ou facture","quelle difference","devis proforma"],"a":"Les 3 documents :\n• Proforma : l’estimation avec les prix du catalogue (N° PF-…), statut « En attente », sans cachet.\n• Facture (onglet FACTURE) : porte le cachet PAYÉ, ou NON PAYÉ si le mode de paiement est « Non Payé ».\n• Reçu (onglet REÇU) : preuve de paiement, toujours avec le cachet PAYÉ.\nFactures et reçus se font dans « Factures & Reçus »."},
{"id":"modfacture","k":["modifier une facture","modifier facture","corriger","rouvrir","retrouver","ancienne facture","anciens documents","historique","changer facture","supprimer une facture","supprimer facture","effacer facture","ouvrir une facture","mes factures","liste des factures"],"a":"Pour retrouver, modifier ou supprimer un document :\n1. « Factures & Reçus » → « 📚 Mémoire ».\n2. Cherche par client ou N° dans « Rechercher client, N°… ».\n3. « ✏️ Ouvrir » pour le modifier (prix, quantités, client…), puis « 💾 Sauvegarder dans Mémoire » pour enregistrer la mise à jour.\n4. « 👁️ Voir » affiche l’aperçu, « 🖨️ » l’imprime.\n5. « 🗑️ » le supprime : clique une 2e fois sur « Confirmer ? » pour valider."},
{"id":"paiement","k":["paye","payer","paiement","mode de paiement","wave","orange money","cash","especes","virement","non paye","cachet","statut","regle","garantie","main d oeuvre","main d oeuvre"],"a":"Dans « Factures & Reçus », le Mode de paiement peut être : Wave, Payé Cash, Orange Money, Espèces, Virement ou Non Payé.\nLe cachet sur le document : PAYÉ (avec la date et le mode) pour tout mode sauf « Non Payé », NON PAYÉ si tu choisis « Non Payé ». Un REÇU est toujours PAYÉ.\nTu peux aussi indiquer une Garantie (ex. 6 mois) et une Main d’œuvre en FCFA, ajoutée au Montant Total."},
{"id":"calcul","k":["calcul","calculer","comment est calcule","tva","hors taxe","ht","materiel","somme"],"a":"Le calcul est automatique : chaque ligne = Qté × P.U ; « Matériel » = somme des lignes ; Montant Total = Matériel + Main d’œuvre. Les prix du catalogue sont affichés HT en FCFA et l’application n’ajoute pas de ligne TVA."},
{"id":"numero","k":["numero","n°","numerotation","sp 2026","changer le numero","numero de facture"],"a":"Le N° d’une facture ou d’un reçu se met tout seul (UI-2026-001, puis 002…, selon le nombre de documents en Mémoire). Tu peux le modifier en tapant dans la case « N° ». Les proformas ont un N° PF-2026-… et les devis un N° DV-…."},
{"id":"imprimer","k":["imprimer","impression","pdf","telecharger","exporter document","imprimante","enregistrer en pdf"],"a":"Pour imprimer ou faire un PDF :\n• Devis : « 🖨️ Imprimer » sur la page Devis.\n• Proforma : « Imprimer / PDF ».\n• Facture / reçu : « 🖨️ Imprimer » dans Factures & Reçus, ou « 🖨️ » dans la liste de la Mémoire.\n• Plusieurs d’un coup : Mémoire → « 🖨️ Tout imprimer » ; résumé : « 📋 Récapitulatif ».\nDans la fenêtre d’impression, choisis « Enregistrer au format PDF » pour obtenir un fichier. Le document reprend ton entreprise, le client, le tableau, le Montant Total, le cachet et les zones de signature."},
{"id":"memoire","k":["memoire","sauvegarde","sauvegarder","exporter","exporter memoire","recapitulatif","vider memoire","enregistrement","donnees","perdu","copie de sauvegarde"],"a":"La « 📚 Mémoire - Tous mes travaux » (dans Factures & Reçus) garde tes factures et reçus :\n• « 💾 Sauvegarder dans Mémoire » : enregistre le document en cours\n• « ✏️ Ouvrir » / « 👁️ Voir » / « 🖨️ » / « 🗑️ » sur chaque ligne\n• « 🖨️ Tout imprimer » et « 📋 Récapitulatif »\n• « 💾 Exporter mémoire » : télécharge un fichier de sauvegarde (UNION_IMPRIMERIE_MEMOIRE_date.json)\n• « 🗑️ Vider mémoire » : efface tout (clique 2 fois pour confirmer)\nLes documents sont enregistrés dans le navigateur de cet appareil : exporte la mémoire de temps en temps pour avoir une copie."},
{"id":"clients","k":["client","ajouter un client","liste des clients","rechercher client","contact","telephone du client","nouveau client"],"a":"Dans « Clients », clique sur « Ajouter un client » puis remplis : nom, téléphone, entreprise et adresse / ville. Valide avec « Ajouter le client ». Tu peux ensuite le retrouver avec « Rechercher client, N°… ».\nDans une facture, en tapant son nom, ses informations se remplissent toutes seules. Le client principal est celui de ton profil."},
{"id":"profil","k":["profil","mon profil","entreprise","photo","logo","nom complet","configurer","informations","mon telephone","mon adresse"],"a":"Dans « Mon profil / Mon entreprise » tu configures ton nom, le nom de ton entreprise, ton téléphone (9 chiffres minimum), ton adresse et ta photo (« Ajouter ma photo »). Si l’image est trop lourde, elle est réduite automatiquement à 80 Ko : choisis-en une autre si le message d’erreur apparaît. Clique sur « Enregistrer » pour valider."},
{"id":"motdepasse","k":["mot de passe","motdepasse","password","code d acces","verrouiller","deconnecter","connexion","ouvrir l application","oublie","changer mot de passe"],"a":"Connexion : tape ton numéro de téléphone et ton mot de passe, puis « Entrer ». La toute première fois, ajoute aussi ta photo et ton nom : ton espace est créé automatiquement. L’appareil te reconnaît ensuite et tu entres directement.\nChanger ton mot de passe : Mon profil → « Modifier mot de passe » → ancien mot de passe, nouveau (6 caractères minimum), confirmation, puis « Valider le nouveau mot de passe ».\nMot de passe oublié ? Sur l’écran de connexion, clique « Mot de passe oublié ? » : un message WhatsApp pour l’administrateur s’ouvre avec ton numéro.\nSe déconnecter : bouton 🚪 en haut du tchat de groupe, ou « Se déconnecter / Verrouiller » dans le menu."},
{"id":"acces","k":["acces","abonnement","bloque","bloquer","debloquer","desactive","plan","enterprise","limite de duree","reactiver"],"a":"Ton accès est affiché dans le menu : « Accès actif ». Il reste actif tant que l’administrateur ne le bloque pas. Si ton accès est bloqué, tu vois « Accès bloqué » / « Accès désactivé », même avec le bon mot de passe. Utilise alors « Contacter / Accès Admin » pour te faire réactiver."},
{"id":"admin","k":["admin","administrateur","surveillance","a distance","reactivation","controle","code admin"],"a":"Le bouton Admin ouvre un panneau réservé à l’administrateur, protégé par un code qui n’est jamais affiché. Il permet de suivre l’état des comptes, de bloquer ou débloquer un accès, et de le réactiver avec un code de réactivation. L’état est sauvegardé automatiquement après chaque action."},
{"id":"groupe","k":["tchat","chat","groupe","message","discussion","en ligne","whatsapp","parler aux autres","membres"],"a":"Le panneau « 💬 Groupe UNION IMPRIMERIE » est un tchat entre les membres (ce n’est pas moi). Tu écris un message, tous les membres le voient, et tu vois qui est en ligne (point vert). 👋 salue tout le monde, ✕ réduit le panneau (il revient avec le bouton 💬 en bas à droite), 🚪 te déconnecte. Moi, l’assistant d’aide 🤖 (bouton juste à gauche du 💬), je réponds seulement aux questions sur le site."},
{"id":"aide","k":["aide","help","probleme","bug","erreur","marche pas","support","assistance"],"a":"En cas de souci : vérifie ta connexion, recharge la page, puis réessaie. Si le message « Accès bloqué » ou une erreur persiste, utilise « Contacter / Accès Admin » pour joindre l’administrateur. Si un produit ou un prix n’apparaît pas, vérifie dans « 🛍️ Mes produits » qu’il n’est pas caché (bouton vert)."}
];
  var CHIPS=[["C’est quoi ce site ?", "present"], ["Modifier les prix", "modprix"], ["Mes produits", "mesproduits"], ["Faire une facture", "facture_creer"], ["Devis → Facture", "facture_devis"], ["Reçu ou facture ?", "recu"], ["Retrouver / modifier une facture", "modfacture"], ["Mode de paiement & cachet", "paiement"], ["Imprimer / PDF", "imprimer"], ["Mémoire", "memoire"], ["Ajouter un client", "clients"], ["Mon accès", "acces"], ["Mot de passe", "motdepasse"], ["Admin", "admin"], ["Tchat de groupe", "groupe"]];
  var $=function(i){return document.getElementById(i)};
  var fab=$("uib-fab"),panel=$("uib-panel"),msgs=$("uib-msgs"),form=$("uib-form"),inp=$("uib-in"),started=false;
  function norm(s){return " "+s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/œ/g,"oe").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim().split(" ").map(function(w){return w.length>3&&/s$/.test(w)?w.slice(0,-1):w}).join(" ")+" "}
  function add(t,who){var d=document.createElement("div");d.className="uib-m "+who;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
  function chips(list){var w=document.createElement("div");w.className="uib-chips";list.forEach(function(c){var b=document.createElement("button");b.type="button";b.className="uib-chip";b.textContent=c[0];b.onclick=function(){ask(c[0],c[1])};w.appendChild(b)});msgs.appendChild(w);msgs.scrollTop=msgs.scrollHeight}
  KB.forEach(function(e){e.nk=e.k.map(function(k){return norm(k).trim()})});
  function find(q){var n=norm(q),best=null,bs=0;KB.forEach(function(e){var sc=0;if(e.id==="modprix"&&/ (modifi|chang|corrig|mett|adapt|personnalis|augment|baiss)[a-z]* /.test(n)&&/ (prix|tarif)[a-z]* /.test(n))sc+=8;e.nk.forEach(function(k){var w=k.split(" ").length;if(n.indexOf(" "+k+" ")>-1)sc+=2+w;else if(k.length>3&&n.indexOf(k)>-1)sc+=1+w*0.5});if(sc>bs){bs=sc;best=e}});return bs>0?best:null}
  function reply(e){setTimeout(function(){if(e){add(e.a,"bot")}else{add("Je n’ai pas bien compris. Choisis un sujet ci-dessous ou reformule avec un mot clé (prix, facture, reçu, devis, client, mémoire, imprimer, accès, mot de passe, admin…).","bot")}chips(CHIPS)},350)}
  function ask(text,id){add(text,"me");var e=null;if(id){KB.forEach(function(x){if(x.id===id)e=x})}else{e=find(text)}reply(e)}
  function start(){if(started)return;started=true;add("Bonjour 👋 Je suis l’assistant de UNION IMPRIMERIE. Je t’explique tout le site : modifier les prix, faire des factures et des reçus, devis, proforma, mémoire, clients, accès et administration. Que veux-tu savoir ?","bot");chips(CHIPS)}
  function toggle(open){var o=open===undefined?!panel.classList.contains("open"):open;panel.classList.toggle("open",o);fab.textContent=o?"×":"🤖";if(o){start();setTimeout(function(){inp.focus()},50)}}
  fab.onclick=function(){toggle()};$("uib-close").onclick=function(){toggle(false)};
  form.onsubmit=function(ev){ev.preventDefault();var t=inp.value.trim();if(!t)return;inp.value="";ask(t)};
  document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&panel.classList.contains("open"))toggle(false)});
})();
</script>
<!-- ===== Fin assistant chat ===== -->

</body></html>
